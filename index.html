<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grid Wars</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: #0d0d0d;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow: hidden;
      width: 100%;
      touch-action: manipulation;
    }

    .topbar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 16px 10px;
      padding: 12px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .turn-label {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .turn-blue { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
    .turn-red  { color: #ff0055; text-shadow: 0 0 10px #ff0055; }

    .btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #e0e0e0;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

    .board-wrap {
      position: relative;
      width: calc(100% - 32px);
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: #1a1a2e;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,240,255,0.05), inset 0 0 50px rgba(0,0,0,0.6);
      flex-shrink: 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      width: 100%;
      height: 100%;
    }

    .cell {
      border: 0.5px solid rgba(255,255,255,0.03);
      position: relative;
      /* КЛЮЧЕВОЕ: ячейки должны ловить события */
      pointer-events: auto;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .cell.wall-blue {
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff, inset 0 0 4px rgba(255,255,255,0.3);
      z-index: 1;
    }

    .cell.wall-red {
      background: #ff0055;
      box-shadow: 0 0 8px #ff0055, inset 0 0 4px rgba(255,255,255,0.3);
      z-index: 1;
    }

    .cell.head-blue {
      background: #00f0ff;
      box-shadow: 0 0 16px #00f0ff, 0 0 6px #fff, inset 0 0 8px rgba(255,255,255,0.5);
      border: 1.5px solid #fff;
      z-index: 3;
      animation: pulseHead 1.5s infinite ease-in-out;
    }

    .cell.head-red {
      background: #ff0055;
      box-shadow: 0 0 16px #ff0055, 0 0 6px #fff, inset 0 0 8px rgba(255,255,255,0.5);
      border: 1.5px solid #fff;
      z-index: 3;
      animation: pulseHead 1.5s infinite ease-in-out;
    }

    @keyframes pulseHead {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.9); opacity: 0.8; }
    }

    .cell.valid-move {
      background: rgba(0,240,255,0.12);
      cursor: pointer;
    }

    .cell.valid-move::after {
      content: '';
      position: absolute;
      top: 35%; left: 35%; right: 35%; bottom: 35%;
      background: rgba(0,240,255,0.5);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,240,255,0.6);
      animation: pulseDot 1.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .overlay.active { opacity: 1; pointer-events: auto; }

    .overlay h2 {
      font-size: 2.2rem;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 900;
    }

    .win-blue { color: #00f0ff; text-shadow: 0 0 25px #00f0ff; }
    .win-red  { color: #ff0055; text-shadow: 0 0 25px #ff0055; }

    .particle-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .shake { animation: shakeAnim 0.5s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .instructions {
      margin-top: 14px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
      text-align: center;
      max-width: 480px;
      padding: 0 16px;
      line-height: 1.5;
    }

    .instructions strong { color: #00f0ff; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="turn-label turn-blue" id="turnLabel">YOUR TURN</div>
    <button class="btn" id="btnRestart">Restart</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
    <canvas class="particle-canvas" id="particleCanvas"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="resultText"></h2>
      <button class="btn" id="btnPlayAgain">Play Again</button>
    </div>
  </div>

  <div class="instructions">
    <strong>How to play:</strong> Tap an adjacent empty cell to extend your trail. 
    Trap the AI! Every visited cell becomes a permanent wall.
  </div>

  <script>
  (function() {
    'use strict';

    const GRID_SIZE = 15;
    const EMPTY = 0, BLUE = 1, RED = 2;

    const boardEl = document.getElementById('board');
    const wrapEl  = document.getElementById('boardWrap');
    const turnLabel = document.getElementById('turnLabel');
    const overlay = document.getElementById('overlay');
    const resultText = document.getElementById('resultText');
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let grid = [], bluePos, redPos, turn, gameOver = false;
    let particles = [], animFrame = null;

    const DIRS = [
      {dr:-1, dc:0}, {dr:1, dc:0}, {dr:0, dc:-1}, {dr:0, dc:1}
    ];

    // ===== INIT =====
    function initBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;

          // ВАЖНО: touchstart для мобильных, click для десктопа
          cell.addEventListener('touchstart', onCellTouch, {passive: false});
          cell.addEventListener('click', onCellClick);

          boardEl.appendChild(cell);
        }
      }
    }

    function resetGame() {
      gameOver = false;
      turn = BLUE;
      particles = [];
      overlay.classList.remove('active');
      wrapEl.classList.remove('shake');

      grid = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(EMPTY));

      bluePos = {r: 14, c: 0};
      redPos  = {r: 0, c: 14};
      grid[14][0] = BLUE;
      grid[0][14] = RED;

      resizeCanvas();
      render();
    }

    // ===== RENDER =====
    function getCell(r, c) {
      return boardEl.children[r * GRID_SIZE + c];
    }

    function render() {
      // Сначала сбрасываем все классы
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = getCell(r, c);
          cell.className = 'cell';

          // Подсветка доступных ходов
          if (!gameOver && turn === BLUE && isValidMove(r, c, BLUE)) {
            cell.classList.add('valid-move');
          }

          // Стены
          if (grid[r][c] === BLUE) cell.classList.add('wall-blue');
          if (grid[r][c] === RED)  cell.classList.add('wall-red');
        }
      }

      // Головы поверх всего (последними)
      getCell(bluePos.r, bluePos.c).classList.add('head-blue');
      getCell(redPos.r, redPos.c).classList.add('head-red');

      // Топбар
      if (gameOver) {
        turnLabel.textContent = 'GAME OVER';
        turnLabel.className = 'turn-label';
      } else if (turn === BLUE) {
        turnLabel.textContent = 'YOUR TURN';
        turnLabel.className = 'turn-label turn-blue';
      } else {
        turnLabel.textContent = 'AI TURN';
        turnLabel.className = 'turn-label turn-red';
      }
    }

    // ===== LOGIC =====
    function isValidMove(r, c, player) {
      if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return false;
      if (grid[r][c] !== EMPTY) return false;
      const pos = player === BLUE ? bluePos : redPos;
      const dr = Math.abs(r - pos.r), dc = Math.abs(c - pos.c);
      return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
    }

    function getValidMoves(pos) {
      const moves = [];
      for (const d of DIRS) {
        const nr = pos.r + d.dr, nc = pos.c + d.dc;
        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && grid[nr][nc] === EMPTY) {
          moves.push({r: nr, c: nc});
        }
      }
      return moves;
    }

    function movePlayer(r, c) {
      if (gameOver || turn !== BLUE) return;
      if (!isValidMove(r, c, BLUE)) return;

      bluePos = {r, c};
      grid[r][c] = BLUE;

      // Проверяем, не проиграл ли AI
      if (getValidMoves(redPos).length === 0) {
        endGame(BLUE);
        return;
      }

      turn = RED;
      render();
      setTimeout(aiTurn, 350);
    }

    // ===== AI =====
    function aiTurn() {
      if (gameOver) return;
      const moves = getValidMoves(redPos);
      if (moves.length === 0) {
        endGame(BLUE);
        return;
      }

      let best = null, bestScore = -Infinity;
      for (const m of moves) {
        let score = countEmptyNeighbors(m.r, m.c) * 10;

        const dist = Math.abs(m.r - bluePos.r) + Math.abs(m.c - bluePos.c);
        if (dist <= 3) {
          const blocks = [[-1,0],[1,0],[0,-1],[0,1]].some(([dr,dc]) =>
            m.r+dr === bluePos.r && m.c+dc === bluePos.c
          );
          score += blocks ? 30 : (4-dist)*3;
        }

        if (m.r === 0 || m.r === 14) score -= 2;
        if (m.c === 0 || m.c === 14) score -= 2;
        score += Math.random() * 2;

        if (score > bestScore) {
          bestScore = score;
          best = m;
        }
      }

      redPos = {r: best.r, c: best.c};
      grid[best.r][best.c] = RED;

      if (getValidMoves(bluePos).length === 0) {
        endGame(RED);
        return;
      }

      turn = BLUE;
      render();
    }

    function countEmptyNeighbors(r, c) {
      let count = 0;
      for (const d of DIRS) {
        const nr = r + d.dr, nc = c + d.dc;
        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && grid[nr][nc] === EMPTY) count++;
      }
      return count;
    }

    // ===== END GAME =====
    function endGame(winner) {
      gameOver = true;
      render();
      wrapEl.classList.add('shake');
      resultText.textContent = winner === BLUE ? 'BLUE WINS' : 'RED WINS';
      resultText.className = winner === BLUE ? 'win-blue' : 'win-red';
      overlay.classList.add('active');
      spawnParticles(winner === BLUE ? 'blue' : 'red', 60);
    }

    // ===== PARTICLES =====
    function resizeCanvas() {
      const rect = wrapEl.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);

    function spawnParticles(color, count) {
      const rect = wrapEl.getBoundingClientRect();
      const cw = rect.width / GRID_SIZE, ch = rect.height / GRID_SIZE;
      const col = color === 'blue' ? '#00f0ff' : '#ff0055';
      const type = color === 'blue' ? BLUE : RED;

      for (let i = 0; i < count; i++) {
        let r, c, tries = 0;
        do { r = Math.floor(Math.random()*15); c = Math.floor(Math.random()*15); tries++; }
        while (tries < 200 && grid[r][c] !== type);

        particles.push({
          x: c*cw + cw/2, y: r*ch + ch/2,
          vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
          life: 1, decay: 0.01 + Math.random()*0.02,
          size: 2 + Math.random()*4, color: col
        });
      }
      if (!animFrame) loopParticles();
    }

    function loopParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      animFrame = particles.length > 0 ? requestAnimationFrame(loopParticles) : null;
    }

    // ===== INPUT HANDLERS (ИСПРАВЛЕНО) =====

    // Touch для мобильных — предотвращаем скролл
    function onCellTouch(e) {
      e.preventDefault();      // блокируем скролл/зум
      e.stopPropagation();     // не даём всплыть
      handleCellInput(e.target);
    }

    // Click для десктопа
    function onCellClick(e) {
      handleCellInput(e.target);
    }

    function handleCellInput(target) {
      const cell = target.closest('.cell');
      if (!cell) return;

      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);

      // Дебаг: можно раскомментировать для проверки
      // console.log('Tapped:', r, c, 'valid?', isValidMove(r,c,BLUE));

      movePlayer(r, c);
    }

    // ===== BUTTONS =====
    document.getElementById('btnRestart').addEventListener('click', resetGame);
    document.getElementById('btnPlayAgain').addEventListener('click', resetGame);

    // ===== START =====
    initBoard();
    resetGame();

  })();
  </script>

</body>
</html>
